<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Administration — Le Pain de la Cité</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script>
    // Remplacer par l'URL du site Netlify créé pour l'authentification
    // (Site settings > Identity), ex. "https://lpdc-admin.netlify.app".
    var NETLIFY_SITE_URL = "https://REMPLACER-PAR-VOTRE-SITE-NETLIFY.netlify.app";

    if (window.netlifyIdentity) {
      window.netlifyIdentity.init({ APIUrl: NETLIFY_SITE_URL + "/.netlify/identity" });
      window.netlifyIdentity.on("init", function (user) {
        if (!user) {
          window.netlifyIdentity.on("login", function () {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
