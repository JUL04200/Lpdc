backend:
  name: github
  repo: JUL04200/Lpdc
  branch: claude/pain-cite-bakery-website-ovmc6d
  base_url: https://lepaindelacite.com
  auth_endpoint: api/auth

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "menu"
    label: "Menu Click & Collect"
    files:
      - name: "menu"
        label: "Articles et desserts"
        file: "data/menu.json"
        fields:
          - label: "Articles à la carte"
            name: "alacarte"
            widget: "list"
            summary: "{{fields.name}} — {{fields.price}} €"
            fields:
              - { label: "Nom de l'article", name: "name", widget: "string" }
              - { label: "Prix (€)", name: "price", widget: "number", value_type: "float" }
              - { label: "Visible sur le site (décochez pour le retirer, recochez pour le remettre)", name: "visible", widget: "boolean", default: true }
              - { label: "Proposer aussi comme dessert dans les formules du midi", name: "dessertOption", widget: "boolean", default: false, required: false }
